[package]
name = "melon-chart-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3

[dev-dependencies]
serde_path_to_error = "0.1.20"
